<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="Y115cW2_CPOof6qJBeFgobm_zPU4KICzuXiY_rGe1ig" />
    <title>Barbora Gustafsson - UX &amp; Product Designer</title>
    <meta
      name="description"
      content="Barbora Gustafsson — UX & Product Designer based in Uppsala/Stockholm, Sweden. I study people. Case studies, code projects, and more."
    />
    <link rel="canonical" href="https://barboragustafsson.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barboragustafsson.com/" />
    <meta property="og:title" content="Barbora Gustafsson - UX & Product Designer" />
    <meta
      property="og:description"
      content="I study people. UX & Product Designer based in Uppsala/Stockholm, Sweden — case studies, code projects, and more."
    />
    <!-- The link preview (LinkedIn, Slack, Messages): a 1200x630 card in the
         site's own look (sidebar panel, name, yellow "Get in touch" pill,
         and a bento of real project tiles), so it reads as a portfolio
         rather than a cropped photo. JPEG, as some platforms still skip
         WebP previews. -->
    <meta property="og:image" content="https://barboragustafsson.com/social-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Barbora Gustafsson, UX &amp; Product Designer, with tiles from her projects Midoma, Piggy Bank, PromptKee and Squinty." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barbora Gustafsson - UX & Product Designer" />
    <meta
      name="twitter:description"
      content="I study people. UX & Product Designer based in Uppsala/Stockholm, Sweden — case studies, code projects, and more."
    />
    <meta name="twitter:image" content="https://barboragustafsson.com/social-preview.jpg" />

    <!-- The homepage's first case study tile (Piggy Bank) is the LCP
         candidate on wide viewports. This is a client-rendered app, so
         without this hint the browser can't discover/start fetching it
         until React actually renders — this lets it start immediately
         from the raw HTML instead. Keep this in sync with
         `workItems.ts`'s first case study's `image` field (and with
         BentoGrid.tsx's `thumbSrcSet`/`SQUARE_THUMB_SIZES` when that is a
         thumbnail rather than a single-file device mockup). -->
    <link
      rel="preload"
      as="image"
      href="/work/images/midoma-devices.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
