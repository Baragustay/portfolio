<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="Y115cW2_CPOof6qJBeFgobm_zPU4KICzuXiY_rGe1ig" />
    <title>Barbora Gustafsson - UX &amp; Product Designer</title>
    <meta
      name="description"
      content="Barbora Gustafsson — UX & Product Designer based in Uppsala/Stockholm, Sweden. I study people. Case studies, code projects, and more."
    />
    <link rel="canonical" href="https://barboragustafsson.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barboragustafsson.com/" />
    <meta property="og:title" content="Barbora Gustafsson - UX & Product Designer" />
    <meta
      property="og:description"
      content="I study people. UX & Product Designer based in Uppsala/Stockholm, Sweden — case studies, code projects, and more."
    />
    <!-- The link preview (LinkedIn, Slack, Messages): "Barbora UI/UX" and a
         pixel figure of me saying "I study people!", in the site's dark,
         pixel-art look. 1.91:1 at double size so it stays sharp; JPEG, as
         some platforms still skip WebP previews. A new file name when it
         changes, so platforms don't keep showing a cached old one. -->
    <meta property="og:image" content="https://barboragustafsson.com/social-preview-pixel.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Barbora UI/UX: a pixel-art figure with a magnifying glass says “I study people!”" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barbora Gustafsson - UX & Product Designer" />
    <meta
      name="twitter:description"
      content="I study people. UX & Product Designer based in Uppsala/Stockholm, Sweden — case studies, code projects, and more."
    />
    <meta name="twitter:image" content="https://barboragustafsson.com/social-preview-pixel.jpg" />

    <!-- The homepage's first case study tile (Piggy Bank) is the LCP
         candidate on wide viewports. This is a client-rendered app, so
         without this hint the browser can't discover/start fetching it
         until React actually renders — this lets it start immediately
         from the raw HTML instead. Keep this in sync with
         `workItems.ts`'s first case study's `image` field (and with
         BentoGrid.tsx's `thumbSrcSet`/`SQUARE_THUMB_SIZES` when that is a
         thumbnail rather than a single-file device mockup). -->
    <link
      rel="preload"
      as="image"
      href="/work/images/midoma-devices.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
