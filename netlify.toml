[[headers]]
  for = "/*"
  [headers.values]
    # Google Analytics (gtag.js) is the only external script/beacon this
    # site loads; Google Fonts (fonts.googleapis.com/fonts.gstatic.com) is
    # only used by public/game/catch-a-fact.html, served from this same
    # origin, so it still needs to be allowed here. 'unsafe-inline' on
    # style-src is required because framer-motion animates via inline
    # `style` attributes, not stylesheet classes. `data:` on font-src is
    # for @fontsource/press-start-2p's own CSS, which embeds a legacy
    # .woff fallback as a base64 data: URI for less-common script
    # subsets (e.g. Cyrillic Extended) — harmless in practice since no
    # text on this site uses those characters, but it logged a CSP
    # console error on every page load regardless.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # No `includeSubDomains`: frontend.barboragustafsson.com is hosted
    # separately on Hostinger and isn't confirmed to serve HTTPS yet.
    Strict-Transport-Security = "max-age=31536000"

# The "Catch a Fact" game (public/game/) is a standalone static HTML
# file with its entire game logic written as inline <script> tags, not
# built by Vite — the site-wide CSP above (no 'unsafe-inline' on
# script-src) silently blocked that inline script from executing at
# all in production, breaking the game completely (no error shown;
# CSP violations fail silently unless devtools console is open) while
# working fine locally, since `npm run dev` doesn't send these headers.
# Netlify merges header blocks by specificity, so this overrides just
# the CSP for this one path rather than loosening it site-wide.
[[headers]]
  for = "/game/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; media-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
