[[headers]]
  for = "/*"
  [headers.values]
    # Google Analytics (gtag.js) is the only external script/beacon this
    # site loads; Google Fonts (fonts.googleapis.com/fonts.gstatic.com) is
    # only used by public/game/catch-a-fact.html, served from this same
    # origin, so it still needs to be allowed here. 'unsafe-inline' on
    # style-src is required because framer-motion animates via inline
    # `style` attributes, not stylesheet classes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # No `includeSubDomains`: frontend.barboragustafsson.com is hosted
    # separately on Hostinger and isn't confirmed to serve HTTPS yet.
    Strict-Transport-Security = "max-age=31536000"
